<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Crosssa</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e2e8f0;
  }
  .box { text-align: center; padding: 24px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 16px;
    border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #fca5a5; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <div id="msg">Checking…</div>
  </div>

  <script>
    // ── CHANGE THIS before deploying ──────────────────────────────────────
    // This is a shared secret, not real security — anyone who reads this
    // page's source can see it. It only raises the bar (an obscure page
    // name + a key someone would have to already know or find in view-
    // source) above a completely open bypass. Treat it like a shared
    // password: rotate it if it ever leaks, and don't post the full URL
    // anywhere public.
    var SECRET_KEY = 'Ka1loh@22057';
    var COOKIE_NAME = 'crosssa_maintenance_bypass';
    var COOKIE_DAYS = 30;

    var params = new URLSearchParams(window.location.search);
    var key = params.get('key');

    if (key && key === SECRET_KEY) {
      var expires = new Date(Date.now() + COOKIE_DAYS * 24 * 60 * 60 * 1000).toUTCString();
      document.cookie = COOKIE_NAME + '=1; path=/; expires=' + expires + '; SameSite=Lax; Secure';
      document.getElementById('msg').textContent = 'Access granted — redirecting…';
      window.location.replace('/');
    } else {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('msg').innerHTML = 'Invalid or missing key.<div class="err">Add ?key=... to this URL.</div>';
    }
  </script>
</body>
</html>
